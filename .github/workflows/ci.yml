name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  OPENAI_API_KEY: test-key

jobs:
  quality:
    name: Python 품질
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 checkout
        uses: actions/checkout@v6
      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: 개발 의존성 설치
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: 단위·smoke 테스트
        run: python -m pytest -q -m "not integration and not external"
      - name: Ruff 검사
        run: python -m ruff check .
      - name: mypy 검사
        run: python -m mypy src
      - name: 평가 CLI 회귀 검사
        run: python -m evaluation.run --results evaluation/retrieval-results.example.jsonl

  postgres-integration:
    name: pgvector 통합
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql+psycopg://rag:rag@localhost:5432/rag
      DATABASE_URL: postgresql+psycopg://rag:rag@localhost:5432/rag
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: rag
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: 저장소 checkout
        uses: actions/checkout@v6
      - name: Python 설정
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: 개발 의존성 설치
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: 데이터베이스 migration
        run: alembic upgrade head
      - name: pgvector 통합 테스트
        run: python -m pytest -q -m integration

  container-infra:
    name: 컨테이너·Terraform
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 checkout
        uses: actions/checkout@v6
      - name: Compose 설정 검사
        run: docker compose config -q
      - name: 애플리케이션 이미지 빌드
        run: docker build --tag company-doc-rag:ci .
      - name: CPU 런타임 smoke 검사
        run: >-
          docker run --rm company-doc-rag:ci python -c
          "import torch; import sentence_transformers; import langfuse;
          import company_doc_rag.main; assert torch.version.cuda is None"
      - name: Terraform 설정
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"
      - name: Terraform 형식 검사
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: Terraform 초기화
        run: terraform -chdir=infra/terraform init -backend=false
      - name: Terraform 구성 검사
        run: terraform -chdir=infra/terraform validate
